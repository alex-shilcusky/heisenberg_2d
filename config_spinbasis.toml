# ----------------------------------------------------------------------
# Base configuration  (spin basis; companion to config_eigenbasis.toml)
#
# Energies are logged in S = sigma/2 units, the same as the eigenbasis runs,
# so learning rates below are directly comparable to that config. (NetKet's
# Heisenberg operator is in Pauli units, 4x larger; run_2D_spinbasis.py scales
# it by 1/4.)
# ----------------------------------------------------------------------

[system]
basis = "spin"        # "spin" | "eigen": selects spinbasis/ or eigenbasis/ code and data/<basis>basis/
L = 6                 # L x L periodic square lattice, N = L^2 spins
J1 = 1.0
J2 = 0.0
sign_rule = "FF"      # Marshall sign rule per [J1, J2] bond family, T/F each.
                      # "TF" = Marshall-rotated: the J2 = 0 ground state is positive,
                      # which the real-weight GCNN below needs. ViT runs use "FF".

[sampler]
SAMPLER = "auto"      # "auto" (exact if the Sz=0 sector <= EXACT_SAMPLER_MAX_STATES) | "exact" | "metro"
MONTECARLO = 4        # N_samples = 2048 * MONTECARLO
seed = 0
chains = 16           # n_chains (metro only)
discard_per_chain = 100   # n_discard_per_chain (metro only); -1 = NetKet default
d_max = 2             # MetropolisExchange: swap spins up to graph distance d_max
                      # (2 includes the J2 diagonals)

[distribution]
# Importance sampling: draw from q = |psi|^alpha instead of |psi|^2 and
# reweight. alpha = 2.0 with auto_alpha = false is plain SR.
# auto_alpha = true makes `alpha` the STARTING exponent only; VMC_NG then tunes
# it every step. Needs on_the_fly = false and a complex-output wavefunction
# (the ViT always; RBM / Jastrow with param_dtype = "complex128").
alpha = 2.0
auto_alpha = false    # FIXED alpha (true => adaptive; alpha above is then the STARTING exponent)
use_ntk = true        # neural tangent kernel
on_the_fly = false

[model]
iter = 10000          # N_ITER (total across resubmissions)
type = "vit"          # "jastrow" | "rbm" | "vit" | "gcnn" -- selects the [model.<type>] table

[model.vit]
# The tutorial's spin-basis ViT (factored attention). Real parameters, complex
# output. d_model must be divisible by n_heads; L by patch_size.
# transl_invariant = true enforces translations by whole patches only, i.e.
# (L / patch_size)^2 of the L^2 lattice translations.
num_layers = 2
d_model = 48                  # = ratio 6 * 8 heads, matching the eigenbasis run
n_heads = 8
patch_size = 2
transl_invariant = true

[model.gcnn]
# NetKet's group-convolutional network (Roth & MacDonald 2021). Exactly
# invariant under the whole space group: all L^2 single-site translations x C4v
# (|G| = 128 on 4x4), unlike the ViT's patch translations only. The default
# characters (all +1) select the fully symmetric sector; parity = +1 adds the
# spin flip. ED on 4x4 (J2 = 0 and 0.5, FF and TF) puts the ground state
# exactly there: every chi(g) = +1, spin-flip parity +1, nondegenerate.
# float64 weights make log psi real, i.e. psi > 0: needs sign_rule = "TF" at
# J2 = 0. At J2 = 0.5 the Marshall rule no longer fixes every sign: use
# param_dtype = "complex128" there.
# Params (4x4, parity +1) = 2 x (F*N + F + F^2*|G| + F): grows with F^2*|G|.
layers = 2
features = 2                  # channels per layer (int, or a list per layer)
symmetries = "space_group"    # "space_group" (translations x C4v) | "translation"
parity = 1                    # spin-flip eigenvalue: +1, -1, or 0 = off
param_dtype = "float64"       # "float64" (needs TF at J2 = 0) | "complex128"

# ----------------------------------------------------------------------
# Other wavefunctions. Only the table named by [model] type is used, and
# submit.sh strips every other [model.*] table from each run's config.json /
# manifest.json, so unused ones never show up in the output. To run one,
# uncomment its table and set type. To SWEEP model.type, uncomment every table
# the sweep needs: a swept key must exist in the base config.
# ----------------------------------------------------------------------
# [model.jastrow]
# # log psi = sum_{i<j} W_ij s_i s_j, a full N x N pair table.
# param_dtype = "complex128"    # "float64" relies on sign_rule for the sign
# # init_std = 0.01             # stddev of the normal init; unset = NetKet default
#
# [model.rbm]
# # alpha = hidden-unit density. With symmetries != "none" it counts feature
# # maps as alpha * N / |G|, so it must be >= |G| / N:
# #   "translation"  |G| = N        -> alpha >= 1
# #   "space_group"  |G| = 8N (C4v) -> alpha >= 8
# #
# # Symmetric RBMs are the fragile ones here (tested on 4x4, 100 steps):
# #   * They fall easily into the Neel state, E/site = -0.5 exactly: E_loc is
# #     then just the zz term with ZERO variance, so sampled SR sees a stationary
# #     point and stops. This is the optimizer, not the ansatz -- optimizing the
# #     EXACT energy, the space-group RBM reaches -0.697 (E0 = -0.70178).
# #   * complex128 + sign_rule "FF" stalls at -0.5; complex cosh has zeros, and
# #     summing over |G| images makes psi ~ 0 (-> E_loc blow-ups) likely.
# #   * auto_alpha = true went NaN within ~10 steps for every symmetric RBM tried.
# #   What worked: symmetries = "translation", param_dtype = "float64",
# #   sign_rule = "TF" (the J2 = 0 ground state is then positive), plain SR
# #   (auto_alpha = false, alpha = 2.0): E/site -0.6993, rel. err 3.6e-3.
# #
# # init_std matters more than anything else here. NetKet's symmetric-RBM default
# # (0.1) is too wide on 6x6: summing |G| images spreads log|psi| across samples
# # far enough that E_loc blows up. Measured at init (6x6, J2 = 0, 512 samples,
# # float64, sign_rule "TF"), as (E/site, spread of log|psi| over samples):
# #   translation alpha=8   0.1 -> (   -0.5032, 13.9)   0.01 -> (-0.5260, 0.21)
# #   space_group alpha=64  0.1 -> (-592044.76, 34.8)   0.01 -> (-0.5526, 1.09)
# # A wide spread also starts the sampler nearly frozen on the single
# # largest-amplitude configuration, which is exactly the zero-variance
# # stationary point described above -- so 0.01 is the default here, not 0.1.
# alpha = 1.0
# symmetries = "none"           # "none" | "translation" | "space_group"
# use_visible_bias = true       # ignored for symmetric RBMs: their single bias
#                               # multiplies sum_i s_i = 0 at Sz = 0
# param_dtype = "complex128"
# init_std = 0.01               # stddev of the normal init. NetKet's own defaults
#                               # are 0.01 (RBM) / 0.1 (symmetric RBM); 0.1 is
#                               # unusable for space_group, see above.

[optimizer]
# Stochastic reconfiguration: optax.sgd carries the lr schedule and VMC_NG
# solves (S + diag_shift * I) delta = F each step. Same defaults as the
# eigenbasis config, i.e. tuned for the ViT. The NetKet tutorials use a much
# larger diag_shift (0.1) for Jastrow / RBM; worth sweeping when comparing.
initial_learning_rate = 5e-2
final_learning_rate = 2e-2
initial_diagonal_shift = 1e-3
final_diagonal_shift = 1e-4
lr_transition_steps = 400
ds_transition_steps = 400

[run]
# Graceful-stop budget. MUST stay below --time in run.sh:
#     b200-devel (--time=04:00:00)  ->  230
#     b200-batch (--time=24:00:00)  ->  1380
MAX_RUNTIME_MIN = 1380
SAVE_EVERY = 50       # checkpoint (+ .progress) and log-flush interval
PRINT_EVERY = 20
DIAG_EVERY = -1       # sampling-health diag -> .diag.jsonl; -1 = PRINT_EVERY, 0 = off
FREEZE_PATIENCE = 3   # abort after this many CONSECUTIVE diags showing a
                      # collapsed wavefunction: Metropolis acceptance < 1e-3
                      # AND Var(E_loc)/N < 1e-12. That pair is never
                      # convergence -- it is psi concentrated on a single
                      # configuration, where E_loc is constant, the sampled
                      # gradient is 0 and SR sits at a false stationary point.
                      # The 2026-09-28 Jastrow run burned a whole 2.3 h window
                      # frozen that way. 0 = off. Needs DIAG_EVERY != 0.
CHUNK_SIZE = 2048

[misc]
EXACT_SAMPLER_MAX_STATES = 200_000

# ----------------------------------------------------------------------
# Parameter sweep
#
# A swept key must already exist in the base configuration above, or
# submit.sh aborts. Nested tables work: [sweep.model.vit] num_layers = [...]
#
# [sweep.*]     -> Cartesian product (every combination)
# [sweep_zip.*] -> zipped column-wise (specific tuples only); every list in
#                  the zipped tables must have the same length, across sections
#
# Compare the three wavefunctions -- 3 runs:
#   [sweep.model]
#   type = ["jastrow", "rbm", "vit"]
#
# ViT depth x width -- 2 x 2 = 4 runs:
#   [sweep.model.vit]
#   num_layers = [2, 8]
#   d_model = [48, 72]
#
# Each wavefunction with its own learning rate -- 3 runs, NOT 27. The tutorials
# take larger SR steps for Jastrow / RBM than for the ViT (0.01 / 0.05 vs
# 0.0075 in Pauli units, i.e. ~0.04 / 0.2 vs 0.03 here); a starting point:
#   [sweep_zip.model]
#   type = ["jastrow", "rbm", "vit"]
#   [sweep_zip.optimizer]
#   initial_learning_rate = [1e-1, 1e-1, 5e-2]
#   final_learning_rate   = [1e-1, 1e-1, 2e-2]
# ----------------------------------------------------------------------

# ----------------------------------------------------------------------
# ACTIVE SWEEP -- 4 runs, zipped column-wise (column i -> run_000i):
#   run_0000  RBMSymm, translations only        (296 params)
#   run_0001  RBMSymm, full space group          (296 params)
#   run_0002  ViT, narrow: d_model=36, 9 patches  (29,880 params)
#   run_0003  ViT, patch 3: d_model=72, 4 patches (117,024 params)
#
# Follow-up to 2026-09-28 (Jastrow / RBM a=1 / RBM a=2 / ViT), where the ViT
# reached E/site = -0.678868 (rel.err 6e-6) and the plain RBMs stalled at
# 7.2e-3 (a=1, 1368 params) and 3.2e-3 (a=2, 2700 params).
#
# Runs 0-1: does imposing lattice symmetry buy accuracy per parameter? A
# symmetric RBM has features = alpha * N / |G| feature maps and
# features * (N + 1) parameters, so the count depends ONLY on the feature
# count, not on the group: translation alpha=8 and space_group alpha=64 both
# give 8 features and exactly 296 parameters. The two columns therefore
# isolate the point group at identical capacity -- and both are ~4.6x smaller
# than the RBM a=1 that managed 7.2e-3. They use float64 + sign_rule "TF"
# because complex128 + "FF" stalls at the Neel state (see [model.rbm]).
#
# Runs 2-3: the ViT is already at the reference on 6x6, so the question is how
# little it can get away with before L = 8 or J2 > 0.
#   run_0002 shrinks capacity 4x at fixed shape.
#   run_0003 keeps capacity (patch size barely moves the parameter count --
#            the patch embedding is tiny next to the blocks) and changes the
#            tokenization to 4 patches of 9 spins. NOTE this also WEAKENS the
#            enforced symmetry: transl_invariant covers (L/patch_size)^2
#            translations, i.e. 4 here against 9 for patch 2.
#
# sign_rule is a unitary transformation, so E0 is unchanged and rel.err stays
# comparable across the "TF" and "FF" columns.
#
# Every zipped list needs 4 entries, so the [model.rbm] keys carry base values
# in the ViT columns and vice versa. They are ignored there, but they do show
# up in that run's manifest sweep_values.
# ----------------------------------------------------------------------
# (submitted 2026-09-30; kept for reference, no longer active)
# [sweep_zip.system]
# sign_rule = ["TF", "TF", "FF", "FF"]
#
# [sweep_zip.model]
# type = ["rbm", "rbm", "vit", "vit"]
#
# [sweep_zip.model.rbm]
# alpha        = [8.0, 64.0, 1.0, 1.0]
# symmetries   = ["translation", "space_group", "none", "none"]
# param_dtype  = ["float64", "float64", "complex128", "complex128"]
# init_std     = [0.01, 0.01, 0.01, 0.01]
#
# [sweep_zip.model.vit]
# d_model    = [72, 72, 36, 72]
# n_heads    = [12, 12, 6, 12]
# patch_size = [2, 2, 2, 3]

# ----------------------------------------------------------------------
# (submitted 2026-10-07 from spinbasis_2d; kept for reference) MATCHED 6x6, J2 = 0.5 COMPARISON, spin basis vs eigenbasis
#
# Identical network and optimizer in both repos. Only the local basis (and each
# basis's sampling) differs:
#   network    4 layers, ratio 6, 8 heads (d_model 48), one token per 2x2 plaquette
#              spin 99,792 params | eigen 99,840 (only the embedding differs)
#   optimizer  lr 5e-2 -> 2e-2, diag shift 1e-3 -> 1e-4 (400 steps), 10,000 steps
#   samples    8192; sign_rule "FF" (no Marshall rotation, as in all J2 = 0 runs)
#   sampling   both: auto_alpha ON, starting from alpha = 2.0. One run per basis.
#              (At FIXED alpha = 2 the eigenbasis Metropolis acceptance fell to
#              0.07 at J2 = 0; adaptive alpha should move it down from there.)
#   partition  b200-batch: 24 h windows, MAX_RUNTIME_MIN = 1380. Both bases use
#              the same cluster profiles (clusters/):
#                  CLUSTER=aicr-batch ./submit.sh config_spinbasis.toml
#              The profile is recorded in <sweep>/cluster.txt and every
#              auto-resubmission reuses it. Without the flag submit.sh picks
#              the devel profile and refuses (1380 min > 4 h walltime).
# Exact reference: E0/site = -0.50381 (6x6, J2 = 0.5,
# importance_sampling_nqs/energy_ref_litt.json).
# The eigenbasis Hamiltonian was checked at J2 = 0.5 before this run: it
# reproduces the exact 4x4 E0/site -0.528620 to 1e-13, and on 6x6 every
# connected state stays in Sz = 0.
# ----------------------------------------------------------------------

# ----------------------------------------------------------------------
# (submitted 2026-10-09 as commit def726f; kept for reference) 4x4 EXACT-SAMPLER SIZE SCAN, spin basis vs eigenbasis
#
# 4 widths at J2 = 0 = 4 runs, matched one-to-one with the 4 runs of
# config_eigenbasis.toml (same widths, same order: run_0000 = XS ... run_0003 = L). Everything else is the
# base config above: 2 layers, exact sampler (no Markov chain, so sampling is
# not a confound), FIXED alpha = 2.0 (auto_alpha off: plain SR, all importance
# weights 1), 8192 samples, b200-devel.
# CONTROL for the adaptive-alpha sweeps 2026-10-08_19-28-13Gd773272 (spin) and
# 2026-10-08_19-28-24Gd773272 (eigen): identical except alpha is fixed.
#
#   width   d_model  heads  (d_head 6)   params
#     XS         6      1                 1,010
#     S         12      2                 3,604
#     M         24      4                13,544
#     L         48      8                52,432
#
# The sizes straddle the Sz=0 sector size, 12,870 states: two below, one at
# it, one above (enough to memorize; tests trainability only). On 6x6 the
# sector is ~1e10, so every network there has to compress. Parameter count vs
# dimension is only a rough guide: the enforced patch translations leave
# ~3,200 orbits, and the ground state's full symmetry fewer still.
#
# Exact 4x4 reference (the driver also prints it): E0/site = -0.701780.
# J2 = 0.5 (E0/site = -0.528620) is deferred: add back
#   [sweep.system]
#   J2 = [0.0, 0.5]
# to run both (8 runs).
#
# To rerun: set [system] sign_rule = "FF", [model] type = "vit", and restore
#   [sweep_zip.model.vit]
#   d_model = [6, 12, 24, 48]
#   n_heads = [1, 2, 4, 8]
# ----------------------------------------------------------------------

# ----------------------------------------------------------------------
# (committed as e8380f1, for Explorer; kept for reference) 4x4 SIZE SCAN, GCNN in the Marshall frame
#
# The ViT size scan above, with the ViT replaced by NetKet's GCNN: same
# 4x4, J2 = 0, exact sampler, 8192 samples, FIXED alpha = 2.0, optimizer and
# 5000 steps; 2 layers like the ViT. Differences: sign_rule = "TF" (real
# weights, positive psi) and the full space group + spin flip built in.
#
#   run       features   params   (ViT run with the closest count)
#   run_0000      2       1,062    d_model 6:   1,010
#   run_0001      4       4,172    d_model 12:  3,604
#   run_0002      8      16,536    d_model 24: 13,544
#   run_0003     14      50,442    d_model 48: 52,432
#
# Exact 4x4 reference: E0/site = -0.701780 (sign_rule does not change it).
#
# To run it, submit from that commit (`git checkout e8380f1`), or set L = 4,
# sign_rule = "TF", SAMPLER = "exact", iter = 5000, type = "gcnn",
# MAX_RUNTIME_MIN = 230 and restore
#   [sweep_zip.model.gcnn]
#   features = [2, 4, 8, 14]
# ----------------------------------------------------------------------

# ----------------------------------------------------------------------
# ACTIVE (2026-10-09): 6x6 SPIN-BASIS RUNS MATCHED TO THE EIGENBASIS RUNS
#
# Same ViT shapes as the 6x6 eigenbasis runs at J2 = 0, so the parameter
# counts match (only the embedding differs). The spin basis already has the
# L2 d72 h12 baseline (2026-09-28_15-04-11/run_0003, 116,784 params, 6.2e-6).
#
#   run       layers d_model heads   params spin / eigen   eigenbasis run(s) matched
#   run_0000     1     90     15     99,495 /  99,585      2026-10-02_19-43-18 run_0000  (6.6e-2 @2k)
#   run_0001     2     66     11     98,340 /  98,406      2026-10-02_19-43-18 run_0001  (7.2e-3 @2k)
#   run_0002     4     48      8     99,792 /  99,840      2026-10-02_19-43-18 run_0002, 2026-10-05 (3.3e-3 @7k)
#   run_0003     8     32      4     87,488 /  87,520      2026-10-02_19-43-18 run_0003  (6.7e-3 @2k)
#   run_0004     8     72     12    433,224 / 433,296      2026-09-23 / 10-05 branches (7.6e-4 @26k)
#
# Settings: 6x6, J2 = 0, sign_rule FF (as every eigenbasis run), Metropolis
# exchange sampler (SAMPLER auto -> metro on 6x6), 8192 samples, FIXED
# alpha = 2.0, lr 5e-2 -> 2e-2, diag shift 1e-3 -> 1e-4, 10,000 steps. The
# eigenbasis runs went 2k-26k steps; every step is logged, so compare at the
# eigenbasis run's step count.
#
# Exact 6x6 reference: E0/site = -0.678872.
#
# Submit (b200-batch, 24 h windows; MAX_RUNTIME_MIN = 1380):
#   CLUSTER=aicr-batch ./submit.sh config_spinbasis.toml
# ----------------------------------------------------------------------
[sweep_zip.model.vit]
num_layers = [1, 2, 4, 8, 8]
d_model    = [90, 66, 48, 32, 72]
